<!doctype html>
<html lang="en" data-look="pixel">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' blob: data: https://api.mapbox.com; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Drop in a photo and see all of its metadata. Everything runs in your browser. Your photo is never uploaded.">
  <title>Inspicio · See what your photos say</title>
  <script src="redirect.js"></script>
  <script src="prefs.js"></script>
  <link rel="canonical" href="https://inspicio.app/">
  <link rel="icon" href="favicon.svg?v=2" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="preload" href="vendor/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="vendor/DepartureMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <script src="vendor/exifr-7.1.3.full.umd.js" defer></script>
  <script src="gainmap.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="Inspicio home">
      <svg class="brand-mark" viewBox="0 0 120 120" aria-hidden="true">
        <g class="mark-pixel">
          <path d="M46 14H14v92h92V14H74" fill="none" stroke="currentColor" stroke-width="7"/>
          <rect class="brand-dot" x="53" y="7" width="14" height="14" fill="currentColor"/>
          <path d="M35 43h14v14H35zM53 43h14v14H53zM53 61h14v14H53zM35 79h14v14H35zM53 79h14v14H53zM71 79h14v14H71z" fill="currentColor"/>
        </g>
        <g class="mark-soft">
          <path d="M44 15H32a17 17 0 0 0-17 17v56a17 17 0 0 0 17 17h56a17 17 0 0 0 17-17V32a17 17 0 0 0-17-17H76" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>
          <circle class="brand-dot" cx="60" cy="15" r="8.5" fill="currentColor"/>
          <rect x="52.5" y="44" width="15" height="44" rx="7.5" fill="currentColor"/>
        </g>
      </svg>
      <span>Inspicio</span>
    </a>
    <div class="topbar-right">
      <p class="local-badge">
        <svg viewBox="0 0 5 6" aria-hidden="true" shape-rendering="crispEdges"><path d="M1 0h3v1H1zM0 1h1v2H0zM4 1h1v2H4zM0 3h5v1H0zM0 4h2v1H0zM3 4h2v1H3zM0 5h5v1H0z" fill="currentColor"/></svg>
        <span>Stays on your device</span>
      </p>
      <button class="btn" id="open-another" type="button" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>New photo</span>
      </button>
    </div>
  </header>

  <main id="app" data-state="empty">
    <section class="empty" id="empty-view">
      <div class="hero-copy">
        <div class="ticker" id="ticker" aria-hidden="true"></div>
        <h1 id="hero-title">See what your<br>photos say.</h1>
        <p id="hero-sub">Every hidden tag, read here in your browser.</p>
      </div>

      <nav class="modes" id="modes" aria-label="Tools">
        <button class="mode" type="button" data-mode="inspect" aria-pressed="true">Inspect<span class="mode-icon" aria-hidden="true"><svg viewBox="0 0 10 10" width="20" height="20" shape-rendering="crispEdges"><path class="ic-ink" d="M2 0h3v1H2zM1 1h1v1H1zM5 1h1v1H5zM0 2h1v1H0zM6 2h1v1H6zM0 3h1v1H0zM6 3h1v1H6zM0 4h1v1H0zM6 4h1v1H6zM1 5h1v1H1zM5 5h1v1H5zM2 6h3v1H2z"/><path class="ic-shine" d="M2 1h1v1H2zM1 2h1v1H1z"/><path class="ic-glass" d="M3 1h2v1H3zM2 2h4v1H2zM1 3h5v1H1zM1 4h5v1H1zM2 5h3v1H2z"/><path class="ic-wood" d="M6 6h2v1H6zM6 7h3v1H6zM7 8h3v1H7zM8 9h2v1H8z"/></svg></span></button>
        <button class="mode" type="button" data-mode="wipe" aria-pressed="false">Wipe<span class="mode-icon" aria-hidden="true"><svg viewBox="0 0 10 7" width="20" height="14" shape-rendering="crispEdges"><path class="ic-scour" d="M1 0h8v1H1zM0 1h10v1H0z"/><path class="ic-sponge" d="M0 2h10v1H0zM0 3h1v1H0zM2 3h4v1H2zM7 3h3v1H7zM0 4h4v1H0zM5 4h5v1H5zM0 5h2v1H0zM3 5h5v1H3zM9 5h1v1H9zM1 6h8v1H1z"/><path class="ic-pore" d="M1 3h1v1H1zM6 3h1v1H6zM4 4h1v1H4zM2 5h1v1H2zM8 5h1v1H8z"/></svg></span></button>
        <button class="mode" type="button" data-mode="shot-on" aria-pressed="false">Shot on<span class="mode-icon" aria-hidden="true"><svg viewBox="0 0 16 7" width="32" height="14" shape-rendering="crispEdges"><path class="ic-ink" d="M2 0h2v1H2zM11 0h5v1H11zM0 1h9v1H0zM11 1h1v1H11zM15 1h1v1H15zM0 2h3v1H0zM6 2h3v1H6zM11 2h1v1H11zM15 2h1v1H15zM0 3h2v1H0zM7 3h2v1H7zM11 3h1v1H11zM15 3h1v1H15zM0 4h3v1H0zM6 4h3v1H6zM11 4h1v1H11zM15 4h1v1H15zM0 5h9v1H0zM11 5h1v1H11zM15 5h1v1H15zM11 6h5v1H11z"/><path class="ic-screen" d="M12 1h3v1H12zM12 2h3v1H12zM12 3h3v1H12zM12 4h3v1H12zM12 5h3v1H12z"/><path class="ic-steel" d="M3 2h3v1H3zM2 3h1v1H2zM6 3h1v1H6zM3 4h3v1H3z"/><path class="ic-lens" d="M3 3h3v1H3z"/></svg></span></button>
        <button class="mode" type="button" data-mode="film" aria-pressed="false">Film</button>
      </nav>

      <button class="dropzone" id="dropzone" type="button">
        <span class="dropzone-icon" id="photo-stack" aria-hidden="true">
          <svg class="stack-photo stack-back" viewBox="0 0 11 9" shape-rendering="crispEdges"><use href="#photo-glyph"/></svg>
          <svg class="stack-photo stack-mid" viewBox="0 0 11 9" shape-rendering="crispEdges"><use href="#photo-glyph"/></svg>
          <svg class="stack-photo stack-front" viewBox="0 0 11 9" shape-rendering="crispEdges">
            <defs>
              <g id="photo-glyph">
                <rect class="stack-fill" x="1" y="1" width="9" height="7"/>
                <path d="M0 0h11v1H0zM0 8h11v1H0zM0 1h1v7H0zM10 1h1v7H10zM3 2h2v2H3zM1 7h9v1H1zM2 6h2v1H2zM5 5h3v2H5zM6 4h1v1H6zM8 6h1v1H8z" fill="currentColor"/>
              </g>
            </defs>
            <use href="#photo-glyph"/>
          </svg>
        </span>
        <svg class="dropzone-soft" viewBox="0 0 48 48" aria-hidden="true">
          <rect x="6" y="10" width="36" height="28" rx="6" fill="none" stroke="currentColor" stroke-width="2.5"/>
          <circle cx="17" cy="20" r="3.5" fill="currentColor"/>
          <path d="M8 34l10-9 7 6 6-5 9 8" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="dropzone-title">Drop a photo</span>
        <span class="dropzone-sub" id="dropzone-sub">or click to choose one</span>
      </button>

      <ul class="formats" aria-label="Supported formats">
        <li>JPEG</li><li>HEIC</li><li>PNG</li><li>TIFF</li><li>AVIF</li><li>RAW</li>
      </ul>

      <p class="error" id="error" role="alert" hidden></p>

      <div class="empty-foot">
        <p class="empty-note">Nothing is uploaded</p>
        <nav class="legal-links" aria-label="Legal">
          <a href="privacy.html">Privacy</a>
          <a href="terms.html">Terms</a>
          <a href="mailto:inspicio.app@proton.me">Contact</a>
        </nav>
      </div>
    </section>

    <section class="viewer" id="viewer-view" hidden>
      <div class="stage" id="stage"></div>
      <aside class="panel" id="panel" aria-label="Photo metadata"></aside>
    </section>
  </main>

  <div class="drag-overlay" id="drag-overlay" aria-hidden="true">
    <div class="drag-overlay-inner">
      <span class="overlay-drop" id="overlay-drop">Drop to inspect</span>
      <span class="overlay-loading"><span class="spinner"></span>Opening photo…</span>
    </div>
  </div>

  <input type="file" id="file-input" accept="image/*,.heic,.heif,.dng,.arw,.cr2,.cr3,.nef,.nrw,.orf,.rw2,.raf,.pef,.srw,.gpr" hidden>
</body>
</html>
